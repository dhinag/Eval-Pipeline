name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run pytest -q -m "not ollama"
      - name: Offline demo
        run: CONFIG=configs/sample-offline.json scripts/demo.sh
