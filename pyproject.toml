[project]
name = "goldenset"
version = "0.1.0"
description = "Golden-set pipeline: raw support traces to a reviewed eval set"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "spacy>=3.7",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "faker>=30",
    "numpy>=1.26",
    "requests>=2.31",
    "streamlit>=1.40",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "jsonschema>=4.22",
    "types-jsonschema",
    "types-requests",
]

[project.scripts]
goldenset = "goldenset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldenset"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: needs a running Ollama server with the default models"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long lines are allowed: phrase banks and test strings read better unwrapped.
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
